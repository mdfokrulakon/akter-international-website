<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Akter International — Icon-only brand mark -->
  <!-- Navy #0B2545, Deep Green #1B6B45, Slate #55708A -->

  <!-- Left leg (navy) — supplier side -->
  <path d="M150,60 L85,240" fill="none" stroke="#0B2545" stroke-width="20" stroke-linecap="round"/>

  <!-- Right leg (green) — customer side -->
  <path d="M150,60 L215,240" fill="none" stroke="#1B6B45" stroke-width="20" stroke-linecap="round"/>

  <!-- Crossbar left half (navy) -->
  <path d="M108,166 L150,166" fill="none" stroke="#0B2545" stroke-width="13" stroke-linecap="round"/>

  <!-- Crossbar right half (green) -->
  <path d="M150,166 L192,166" fill="none" stroke="#1B6B45" stroke-width="13" stroke-linecap="round"/>

  <!-- Endpoint node: supplier -->
  <circle cx="85" cy="240" r="10" fill="#0B2545"/>

  <!-- Endpoint node: customer -->
  <circle cx="215" cy="240" r="10" fill="#1B6B45"/>

  <!-- Apex node: company / growth point -->
  <circle cx="150" cy="60" r="10" fill="#0B2545"/>

  <!-- Center hub node: connection point -->
  <circle cx="150" cy="166" r="11" fill="#FFFFFF" stroke="#0B2545" stroke-width="3"/>
</svg>
